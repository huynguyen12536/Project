# Development Profile
# Used for local development with hot-reload and expanded logging

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true

logging:
  level:
    com.learnhub: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# LLM Configuration: Anthropic Claude API (dev can use mock or real)
learnhub:
  llm:
    api-key: ${LLM_API_KEY:}
    endpoint: ${LLM_ENDPOINT:https://api.anthropic.com/v1/messages}
    model: ${LLM_MODEL:claude-3-5-sonnet-20241022}
    max-tokens: ${LLM_MAX_TOKENS:1000}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:10}

  # Assessment configuration
  assessment:
    max-concurrent-per-user: 3
    duplicate-window-seconds: 60
    max-sse-subscriptions-per-user: 5
    sse-timeout-minutes: 10

# Development CORS settings - allow local dev servers
app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
