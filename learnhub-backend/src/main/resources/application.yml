spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learnhub}
    username: ${SPRING_DATASOURCE_USERNAME:learnhub}
    password: ${SPRING_DATASOURCE_PASSWORD:learnhubpass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  access-token-ttl-seconds: 900 # 15 minutes
  refresh-token-ttl-seconds: 2592000 # 30 days
  rsa-key-version: ${RSA_KEY_VERSION:1}

security:
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}

brf:
  default-version: 1.0.0

server:
  port: 8080

app:
  mail:
    from: ${MAIL_FROM:noreply@learnhub.local}
  url:
    frontend: ${FRONTEND_URL:http://localhost:3000}
  token:
    verification:
      expiry-hours: ${TOKEN_VERIFICATION_EXPIRY_HOURS:24}
    reset:
      expiry-hours: ${TOKEN_RESET_EXPIRY_HOURS:24}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:30}
