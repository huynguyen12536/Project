spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learnhub}
    username: ${SPRING_DATASOURCE_USERNAME:learnhub}
    password: ${SPRING_DATASOURCE_PASSWORD:learnhubpass}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=24h
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  access-token-ttl-seconds: 900 # 15 minutes
  refresh-token-ttl-seconds: 2592000 # 30 days
  rsa-key-version: ${RSA_KEY_VERSION:1}

security:
  oauth:
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/oauth/github/callback}
      auth-url: "https://github.com/login/oauth/authorize"
      token-url: "https://github.com/login/oauth/access_token"
      user-url: "https://api.github.com/user"
      scopes: ["repo", "user:email"]
      token-expiry-buffer-minutes: 5
      state-token-ttl-minutes: 10
      token-secret: ${GITHUB_TOKEN_SECRET:}

github:
  token:
    encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}

brf:
  default-version: 1.0.0

assessment:
  job-poll-timeout-seconds: 1
  max-retries: 3

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 60000ms
    keep-alive-timeout: 60000ms

app:
  mail:
    from: ${MAIL_FROM:noreply@learnhub.local}
  url:
    frontend: ${FRONTEND_URL:http://localhost:3000}
  token:
    verification:
      expiry-hours: ${TOKEN_VERIFICATION_EXPIRY_HOURS:24}
      expiry-minutes: ${TOKEN_VERIFICATION_EXPIRY_MINUTES:10}
      max-attempts: ${TOKEN_VERIFICATION_MAX_ATTEMPTS:5}
    reset:
      expiry-hours: ${TOKEN_RESET_EXPIRY_HOURS:24}
  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:30}
    cookies:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  notification:
    poll-timeout-seconds: ${NOTIFICATION_POLL_TIMEOUT_SECONDS:1}
    max-retries: ${NOTIFICATION_MAX_RETRIES:4}
  super-admin:
    enabled: ${SUPER_ADMIN_ENABLED:true}
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    first-name: ${SUPER_ADMIN_FIRST_NAME:System}
    last-name: ${SUPER_ADMIN_LAST_NAME:Admin}
