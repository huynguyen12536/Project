server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # -------------------------------------------------------------------------
    # Health Check Endpoint (Nginx-level, no auth)
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # -------------------------------------------------------------------------
    # Backend health check proxy (pass-through)
    # -------------------------------------------------------------------------
    location = /api/health {
        access_log off;
        proxy_pass http://backend_upstream/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints - strict rate limiting (5 req/min)
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # No response body caching for auth
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Auth endpoints alias (OAuth)
    location ~ ^/api/v1/oauth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Server-Sent Events (SSE) - no buffering
    # -------------------------------------------------------------------------
    location ~ ^/api/.*(progress|events|stream) {
        limit_req zone=api_limit burst=10;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE headers
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache";
        add_header Content-Type "text/event-stream";
    }

    # -------------------------------------------------------------------------
    # Backend API - rate limited (60 req/min)
    # -------------------------------------------------------------------------
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # -------------------------------------------------------------------------
    # Actuator endpoints - localhost/internal only
    # -------------------------------------------------------------------------
    location /actuator {
        # Only allow from internal network
        allow 172.20.0.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # -------------------------------------------------------------------------
    # Frontend (React SPA) - served via frontend service
    # -------------------------------------------------------------------------
    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML files - no cache (for SPA routing updates)
    location ~* \.html?$ {
        limit_req zone=general_limit burst=20;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA catch-all - route to frontend
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Block hidden files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
