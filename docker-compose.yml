version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: learnhub
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhubpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  learnhub-app:
    build: ./learnhub-backend
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/learnhub
      - SPRING_DATASOURCE_USERNAME=learnhub
      - SPRING_DATASOURCE_PASSWORD=learnhubpass
      - REDIS_URL=redis://redis:6379
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RSA_PRIVATE_KEY_PEM=${RSA_PRIVATE_KEY_PEM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata:
